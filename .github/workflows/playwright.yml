
name: Playwright Tests and Report

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/reports/**'  
  workflow_dispatch:
    inputs:
      execution:
        description: 'Selecione o teste a ser executado'
        required: true
        type: choice
        options:
          - Todos os testes
          - Smoke testes
          - "Epic: conta-autenticacao"
          - "Story: conta-autenticacao / AQ-2"
          - "API: conta-autenticacao / AQ-2"
          - "Story: conta-autenticacao / AQ-3"
          - "Story: conta-autenticacao / AQ-4"
          - "Story: conta-autenticacao / AQ-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    environment: AQ-2

    outputs:
      test_outcome: ${{ steps.tests.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Checkout reports branch
        uses: actions/checkout@v4
        with:
          ref: relatorios
          path: reports-store

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Clean previous test results
        run: rm -f test-results/results.json

      - name: Run selected tests
        id: tests
        continue-on-error: true
        env:
          SENHA_NOVO_USUARIO: ${{ secrets.SENHA_NOVO_USUARIO }}
          EMAIL_CADASTRADO: ${{ secrets.EMAIL_CADASTRADO }}
          ENDERECO: ${{ secrets.ENDERECO }}
          CEP: ${{ secrets.CEP }}
          CELULAR: ${{ secrets.CELULAR }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Automatic execution: Smoke tests"
            npx playwright test --grep "@smoke"
          else
            case "${{ inputs.execution }}" in
              "Todos os testes")
                npx playwright test
                ;;
              "Smoke testes")
                npx playwright test --grep "@smoke"
                ;;
              "Epic: conta-autenticacao")
                npx playwright test "tests/conta-autenticacao/"
                ;;
              "Story: conta-autenticacao / AQ-2")
                npx playwright test "tests/conta-autenticacao/AQ-2/cadastro.spec.ts"
                ;;
              "API: conta-autenticacao / AQ-2") 
                npx playwright test "tests/conta-autenticacao/AQ-2/cadastro-api.spec.ts"
                ;;
              "Story: conta-autenticacao / AQ-3"|"Story: conta-autenticacao / AQ-4"|"Story: conta-autenticacao / AQ-5")
                echo "Tests not configured for this User Story yet."
                exit 1
                ;;
            esac
          fi
      
      - name: Sync results with BesTest
        run: node scripts/sincronizar-bestest.js
        env:
          BESTEST_API_TOKEN: ${{ secrets.BESTEST_API_TOKEN }}

      - name: Prepare report
        if: always()
        run: |
          mkdir -p docs/reports

          # Recupera os relatórios já armazenados, quando existirem.
          if [ -d reports-store/reports ]; then
            find docs/reports -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -R reports-store/reports/. docs/reports/
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            REPORT_PATH="Smoke-tests"
          else
            case "${{ inputs.execution }}" in
              "Todos os testes")
                REPORT_PATH="All-tests"
                ;;
              "Smoke testes")
                REPORT_PATH="Smoke-tests"
                ;;
              "Epic: conta-autenticacao")
                REPORT_PATH="conta-autenticacao/Epic"
                ;;
              "Story: conta-autenticacao / AQ-2")
                REPORT_PATH="conta-autenticacao/AQ-2"
                ;;
              "API: conta-autenticacao / AQ-2")
                REPORT_PATH="conta-autenticacao/AQ-2/API"
                ;;
              "Story: conta-autenticacao / AQ-3")
                REPORT_PATH="conta-autenticacao/AQ-3"
                ;;
              "Story: conta-autenticacao / AQ-4")
                REPORT_PATH="conta-autenticacao/AQ-4"
                ;;
              "Story: conta-autenticacao / AQ-5")
                REPORT_PATH="conta-autenticacao/AQ-5"
                ;;
            esac
          fi

          echo "REPORT_PATH=$REPORT_PATH" >> "$GITHUB_ENV"

          if [ ! -f playwright-report/index.html ]; then
            echo "HTML report was not generated."
            exit 1
          fi

          mkdir -p "docs/reports/$REPORT_PATH"

          find "docs/reports/$REPORT_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

          cp -R playwright-report/. "docs/reports/$REPORT_PATH/"

      - name: Save updated report
        run: |
          git -C reports-store config user.name "github-actions[bot]"
          git -C reports-store config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p reports-store/reports

          find reports-store/reports -mindepth 1 -maxdepth 1 -exec rm -rf {} +

          cp -R docs/reports/. reports-store/reports/

          git -C reports-store add reports/

          if ! git -C reports-store diff --cached --quiet; then
            git -C reports-store commit -m "Atualizar relatórios HTML"
            git -C reports-store push origin relatorios
          else
            echo "Nenhuma alteração nos relatórios."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark workflow as failed if tests failed
        if: needs.test.outputs.test_outcome == 'failure'
        run: exit 1
