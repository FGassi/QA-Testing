
name: Playwright Tests and Report

on:
  workflow_dispatch:
    inputs:
      story:
        description: 'Select the User Story'
        required: true
        type: choice
        options:
          - AQ-2
          - AQ-3
          - AQ-4
          - AQ-5

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    environment: ${{ inputs.story }}

    outputs:
      test_outcome: ${{ steps.tests.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run selected User Story
        id: tests
        continue-on-error: true
        env:
          SENHA_NOVO_USUARIO: ${{ secrets.SENHA_NOVO_USUARIO }}
          EMAIL_CADASTRADO: ${{ secrets.EMAIL_CADASTRADO }}
          ENDERECO: ${{ secrets.ENDERECO }}
          CEP: ${{ secrets.CEP }}
          CELULAR: ${{ secrets.CELULAR }}
        run: |
          case "${{ inputs.story }}" in
            AQ-2)
              npx playwright test tests/cadastro.spec.ts
              ;;
            AQ-3|AQ-4|AQ-5)
              echo "Tests not configured for this User Story yet."
              exit 1
              ;;
          esac

      - name: Prepare report
        if: always()
        env:
          STORY: ${{ inputs.story }}
        run: |
          if [ ! -f playwright-report/index.html ]; then
            echo "HTML report was not generated."
            exit 1
          fi

          mkdir -p "docs/reports/$STORY"

          find "docs/reports/$STORY" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

          cp -R playwright-report/. "docs/reports/$STORY/"

      - name: Save updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/reports/
          git commit -m "Update report for ${{ inputs.story }}" || echo "No changes to commit"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark workflow as failed if tests failed
        if: needs.test.outputs.test_outcome == 'failure'
        run: exit 1
